<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Midnight Run</title>
<style>
  html,body{margin:0;height:100%;background:#05060f;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none}
  canvas{width:min(100vw,177.78vh);aspect-ratio:16/9;height:auto;box-shadow:0 0 60px #000}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* =====================================================================
   MIDNIGHT RUN  -  a pseudo-3D night racing game (no libraries needed)
   Controls: Arrow keys / WASD   |   R = rain on/off   |   M = mute
   ===================================================================== */
(() => {
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 960, H = 540;
cv.width = W; cv.height = H;

/* ---------- settings ---------- */
const SEG = 200, ROAD = 2200, FOV = 100, CAMH = 1000, DRAW = 220, RUMBLE = 3, LANES = 3;
const CAMD = 1 / Math.tan(FOV / 2 * Math.PI / 180);
const PZ = CAMH * CAMD;                       // distance from camera to player
const MAXS = SEG * 60, ACC = MAXS / 5, BRK = -MAXS, DEC = -MAXS / 5;
const OFFDEC = -MAXS / 2, OFFLIM = MAXS / 4;
const CARW = 0.22;                            // car width in road-half-width units
const FOG = '#6d2a5e';

/* ---------- helpers ---------- */
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const easeIn = (a, b, p) => a + (b - a) * p * p;
const easeIO = (a, b, p) => a + (b - a) * (-Math.cos(p * Math.PI) / 2 + .5);
const fogAt = n => 1 / Math.exp(Math.pow(n / DRAW, 2) * 4);
function rr(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function poly(a, b, c, d, e, f, g, h, col) {
  ctx.fillStyle = col; ctx.beginPath();
  ctx.moveTo(a, b); ctx.lineTo(c, d); ctx.lineTo(e, f); ctx.lineTo(g, h);
  ctx.closePath(); ctx.fill();
}
function text(s, x, y, size, col, align = 'center', weight = 800) {
  ctx.font = `italic ${weight} ${size}px "Segoe UI",Arial,sans-serif`;
  ctx.textAlign = align; ctx.shadowColor = 'rgba(0,0,0,.7)'; ctx.shadowBlur = 8;
  ctx.fillStyle = col; ctx.fillText(s, x, y); ctx.shadowBlur = 0;
}

/* ---------- build the track ---------- */
const segs = [];
let trackLen = 0;
const lastY = () => segs.length ? segs[segs.length - 1].p2.wy : 0;
function addSeg(curve, y) {
  const n = segs.length;
  segs.push({
    i: n, curve,
    p1: { wy: lastY(), wz: n * SEG }, p2: { wy: y, wz: (n + 1) * SEG },
    dark: Math.floor(n / RUMBLE) % 2 === 1, cars: [], props: [], clip: H, fogv: 1
  });
}
function addRoad(enter, hold, leave, curve, y) {
  const startY = lastY(), endY = startY + y * SEG, total = enter + hold + leave;
  for (let n = 0; n < enter; n++) addSeg(easeIn(0, curve, n / enter), easeIO(startY, endY, n / total));
  for (let n = 0; n < hold; n++) addSeg(curve, easeIO(startY, endY, (enter + n) / total));
  for (let n = 0; n < leave; n++) addSeg(easeIO(curve, 0, n / leave), easeIO(startY, endY, (enter + hold + n) / total));
}
(function buildTrack() {
  addRoad(25, 50, 25, 0, 0);
  for (let lap = 0; lap < 2; lap++) {
    const s = lap ? -1 : 1;
    addRoad(25, 35, 25, 4 * s, 0);   addRoad(25, 25, 25, 0, 40);
    addRoad(20, 30, 20, -3 * s, 0);  addRoad(25, 25, 25, 0, -40);
    addRoad(15, 25, 15, -6 * s, 0);  addRoad(25, 25, 25, 0, 60);
    addRoad(20, 30, 20, 3 * s, 0);   addRoad(25, 25, 25, 0, -60);
    addRoad(20, 20, 20, 5 * s, 0);   addRoad(20, 20, 20, -5 * s, 0);
    addRoad(25, 60, 25, 0, 0);
  }
  trackLen = segs.length * SEG;
  // roadside scenery: street lamps and pine trees
  segs.forEach(s => {
    if (s.i % 9 === 0) { s.props.push({ o: -1.3, t: 'lamp' }); s.props.push({ o: 1.3, t: 'lamp' }); }
    else if (s.i % 4 === 0) {
      const side = Math.random() < .5 ? -1 : 1;
      s.props.push({ o: side * (1.8 + Math.random() * 4), t: 'tree', v: Math.random() });
    }
  });
})();
const findSeg = z => segs[Math.floor(z / SEG) % segs.length];

/* ---------- traffic ---------- */
const LANE_X = [-0.62, 0, 0.62], LANE_SP = [0.62, 0.46, 0.32];
const CAR_COLS = ['#1d4ed8', '#e5e7eb', '#16a34a', '#f59e0b', '#7c3aed', '#0e7490', '#9ca3af', '#be123c'];
const cars = [];
for (let k = 1; k <= 24; k++) for (let l = 0; l < 3; l++) {
  cars.push({
    z: 0, o: LANE_X[l], sp: MAXS * LANE_SP[l], lane: l, k,
    col: CAR_COLS[(k * 3 + l) % CAR_COLS.length], last: null
  });
}
function placeCars() {
  segs.forEach(s => s.cars.length = 0);
  cars.forEach(c => {
    c.z = (c.k * trackLen / 25 + (Math.random() - .5) * 4000 + c.lane * 1500) % trackLen;
    c.last = null; findSeg(c.z).cars.push(c);
  });
}
function updateCars(dt) {
  cars.forEach(c => {
    const old = findSeg(c.z);
    c.z = (c.z + c.sp * dt) % trackLen;
    const nw = findSeg(c.z);
    if (old !== nw) { old.cars.splice(old.cars.indexOf(c), 1); nw.cars.push(c); }
  });
}

/* ---------- game state ---------- */
let state = 'title', position = 0, speed = 0, playerX = 0, timeLeft = 45, score = 0;
let lap = 0, crashes = 0, overtakes = 0, invuln = 0, shake = 0, bgX = 0, clock = 0, cd = 3.2, lastCd = 9;
let best = 0, rain = false, touchMode = false;
try { best = +localStorage.getItem('midnightRunBest') || 0; } catch (e) {}
const particles = [], popups = [];
const touch = { l: false, r: false };
const stars = Array.from({ length: 90 }, () => ({ x: Math.random() * W, y: Math.random() * 230, s: Math.random() * 1.6 + .4 }));
const drops = Array.from({ length: 140 }, () => ({ x: Math.random() * W, y: Math.random() * H, l: 10 + Math.random() * 14 }));

function reset() {
  position = 0; speed = 0; playerX = 0; timeLeft = 45; score = 0; lap = 0;
  crashes = 0; overtakes = 0; invuln = 0; shake = 0; particles.length = 0; popups.length = 0;
  placeCars();
}
reset();
function startGame() { reset(); state = 'count'; cd = 3.2; lastCd = 9; }
function popup(t, col = '#fff') { popups.push({ t, col, life: 1.4 }); }

/* ---------- audio (generated in code, no files needed) ---------- */
let AC = null, master, eng, eng2, engG, muted = false;
function audioInit() {
  if (AC) return;
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = .8; master.connect(AC.destination);
    const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 700; f.connect(master);
    engG = AC.createGain(); engG.gain.value = 0; engG.connect(f);
    eng = AC.createOscillator(); eng.type = 'sawtooth'; eng.connect(engG); eng.start();
    eng2 = AC.createOscillator(); eng2.type = 'triangle'; eng2.connect(engG); eng2.start();
  } catch (e) { AC = null; }
}
function beep(freq, dur, type = 'square', vol = .12) {
  if (!AC) return;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.value = freq; g.gain.setValueAtTime(vol, AC.currentTime);
  g.gain.exponentialRampToValueAtTime(.001, AC.currentTime + dur);
  o.connect(g); g.connect(master); o.start(); o.stop(AC.currentTime + dur);
}
function crashSound() {
  if (!AC) return;
  const len = AC.sampleRate * .45, buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
  const s = AC.createBufferSource(); s.buffer = buf;
  const g = AC.createGain(); g.gain.value = .5; s.connect(g); g.connect(master); s.start();
}
function engineSound(sp, on) {
  if (!AC) return;
  const gearF = sp * 6, g = Math.min(5, Math.floor(gearF)), within = clamp(gearF - g, 0, 1);
  const f = 48 + within * 120 + g * 10;
  const t = AC.currentTime;
  eng.frequency.setTargetAtTime(f, t, .05);
  eng2.frequency.setTargetAtTime(f / 2, t, .05);
  engG.gain.setTargetAtTime(on ? .05 + .07 * sp : 0, t, .08);
}

/* ---------- input ---------- */
const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  audioInit();
  if ((e.code === 'Enter' || e.code === 'Space') && (state === 'title' || state === 'over')) startGame();
  if (e.code === 'KeyM') { muted = !muted; if (master) master.gain.value = muted ? 0 : .8; }
  if (e.code === 'KeyR') rain = !rain;
});
addEventListener('keyup', e => { keys[e.code] = false; });
function touchUpdate(e) {
  touch.l = touch.r = false;
  for (const t of e.touches) {
    const rx = (t.clientX - cv.getBoundingClientRect().left) / cv.getBoundingClientRect().width;
    if (rx < .4) touch.l = true; else if (rx > .6) touch.r = true;
  }
}
cv.addEventListener('touchstart', e => {
  e.preventDefault(); touchMode = true; audioInit(); touchUpdate(e);
  if (state === 'title' || state === 'over') startGame();
}, { passive: false });
cv.addEventListener('touchmove', e => { e.preventDefault(); touchUpdate(e); }, { passive: false });
cv.addEventListener('touchend', e => { touchUpdate(e); });
cv.addEventListener('mousedown', () => { audioInit(); if (state === 'title' || state === 'over') startGame(); });

/* ---------- update ---------- */
function wrapDz(dz) {
  if (dz > trackLen / 2) dz -= trackLen;
  if (dz < -trackLen / 2) dz += trackLen;
  return dz;
}
function emit(x, y, n, col, spd) {
  for (let i = 0; i < n; i++) particles.push({
    x, y, vx: (Math.random() - .5) * spd, vy: -Math.random() * spd * .8, life: .5 + Math.random() * .5, col
  });
}
function tick(dt) {
  clock += dt;
  if (shake > 0) shake = Math.max(0, shake - dt * 2);
  const seg0 = findSeg(position + PZ);

  if (state === 'title') {
    speed = MAXS * .35; position = (position + speed * dt) % trackLen;
    playerX = Math.sin(clock * .5) * .5;
    bgX += seg0.curve * .35 * dt * 20; updateCars(dt); engineSound(0, false); return;
  }
  if (state === 'count') {
    cd -= dt;
    const c = Math.ceil(cd);
    if (c !== lastCd && c > 0) { lastCd = c; beep(440, .15); }
    if (cd <= 0) { state = 'play'; beep(880, .5); popup('GO!', '#7CFFB2'); }
    engineSound(.1 + Math.abs(Math.sin(clock * 12)) * .05, true); return;
  }

  const playing = state === 'play';
  const sp = speed / MAXS;
  position += dt * speed;
  if (position >= trackLen) {
    position -= trackLen;
    if (playing) { lap++; timeLeft += 22; popup('CHECKPOINT  +22s', '#FFE066'); beep(660, .12); setTimeout(() => beep(990, .25), 120); }
  }
  const L = playing && (keys.ArrowLeft || keys.KeyA || touch.l);
  const R = playing && (keys.ArrowRight || keys.KeyD || touch.r);
  const U = playing && (keys.ArrowUp || keys.KeyW || touchMode);
  const D = playing && (keys.ArrowDown || keys.KeyS);
  const dx = dt * 2 * sp;
  if (L) playerX -= dx; else if (R) playerX += dx;
  playerX -= dx * sp * seg0.curve * .3;            // centrifugal force
  if (U) speed += ACC * dt; else if (D) speed += BRK * dt; else speed += (playing ? DEC : DEC * 2) * dt;
  const off = playerX < -1 || playerX > 1;
  if (off && speed > OFFLIM) speed += OFFDEC * dt;
  if (off && speed > 4000 && Math.random() < .6) {
    emit(W / 2 - 90, H - 20, 1, 'rgba(120,100,70,.8)', 120); emit(W / 2 + 90, H - 20, 1, 'rgba(120,100,70,.8)', 120);
  }
  playerX = clamp(playerX, -2, 2); speed = clamp(speed, 0, MAXS);
  bgX += seg0.curve * sp * dt * 20;
  updateCars(dt);
  if (invuln > 0) invuln -= dt;

  const pz = position + PZ;
  cars.forEach(c => {
    const dz = wrapDz(c.z - pz);
    if (playing && invuln <= 0 && speed > c.sp && dz > -SEG * .5 && dz < SEG * 1.5 && Math.abs(playerX - c.o) < CARW) {
      speed = c.sp * .4; invuln = 1.2; shake = 1; crashes++;
      playerX += playerX >= c.o ? .25 : -.25;
      crashSound(); emit(W / 2, H - 60, 30, '#ffb347', 500); popup('CRASH!', '#ff5a5a');
    }
    if (playing && c.last !== null && c.last > 0 && dz <= 0 && c.last < SEG * 8) {
      overtakes++; score += 100;
      if (Math.abs(playerX - c.o) < .55) { score += 150; popup('NEAR MISS +250', '#7CFFB2'); }
    }
    c.last = dz;
  });
  if (playing) {
    score += speed * dt / 100;
    timeLeft -= dt;
    if (timeLeft <= 0) {
      timeLeft = 0; state = 'over'; beep(200, .6, 'sawtooth');
      if (score > best) { best = Math.floor(score); try { localStorage.setItem('midnightRunBest', best); } catch (e) {} }
    }
  }
  engineSound(sp, true);

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i]; p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 600 * dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (let i = popups.length - 1; i >= 0; i--) { popups[i].life -= dt; if (popups[i].life <= 0) popups.splice(i, 1); }
}

/* ---------- drawing: world ---------- */
function proj(p, camX, camY, camZ) {
  p.cz = p.wz - camZ;
  p.scale = CAMD / p.cz;
  p.sx = Math.round(W / 2 + p.scale * (-camX) * W / 2);
  p.sy = Math.round(H / 2 - p.scale * (p.wy - camY) * H / 2);
  p.sw = Math.round(p.scale * ROAD * W / 2);
}
function mountains(off, base, amp, f, col) {
  ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0, H / 2 + 5);
  for (let x = 0; x <= W; x += 8) {
    const t = (x + off) * f;
    const h = .5 + .5 * (Math.sin(t) * .6 + Math.sin(t * 2.3 + 1.7) * .3 + Math.sin(t * 5.1) * .1);
    ctx.lineTo(x, base - amp * h);
  }
  ctx.lineTo(W, H / 2 + 5); ctx.closePath(); ctx.fill();
}
function drawBg() {
  const g = ctx.createLinearGradient(0, 0, 0, H / 2);
  g.addColorStop(0, '#050818'); g.addColorStop(.5, '#2b1850'); g.addColorStop(.8, '#a8336a'); g.addColorStop(1, '#ff8a50');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H / 2 + 2);
  ctx.fillStyle = '#0c3324'; ctx.fillRect(0, H / 2, W, H / 2);
  // stars
  ctx.fillStyle = '#fff';
  stars.forEach(s => {
    const x = (((s.x - bgX * .15) % W) + W) % W;
    ctx.globalAlpha = .4 + .5 * Math.abs(Math.sin(clock * 1.5 + s.x));
    ctx.fillRect(x, s.y, s.s, s.s);
  });
  ctx.globalAlpha = 1;
  // sun
  const sx = (((W * .62 - bgX * .3) % (W + 300)) + W + 300) % (W + 300) - 150;
  const sg = ctx.createRadialGradient(sx, H / 2 - 5, 5, sx, H / 2 - 5, 150);
  sg.addColorStop(0, 'rgba(255,230,160,1)'); sg.addColorStop(.25, 'rgba(255,150,90,.85)'); sg.addColorStop(1, 'rgba(255,100,100,0)');
  ctx.fillStyle = sg; ctx.fillRect(sx - 160, H / 2 - 165, 320, 175);
  mountains(-bgX * .5, H / 2 - 10, 70, .006, '#3a1d52');
  mountains(-bgX, H / 2, 55, .011, '#1c1238');
}
function drawSeg(s) {
  const p1 = s.p1, p2 = s.p2;
  const pal = s.dark ? { road: '#52555d', grass: '#0f432d', rumble: '#c8262b', lane: null }
                     : { road: '#5a5d66', grass: '#124c33', rumble: '#d8d8d8', lane: '#e8e8e8' };
  ctx.fillStyle = pal.grass; ctx.fillRect(0, p2.sy, W, p1.sy - p2.sy + 1);
  const r1 = p1.sw / Math.max(6, 2 * LANES), r2 = p2.sw / Math.max(6, 2 * LANES);
  poly(p1.sx - p1.sw - r1, p1.sy, p1.sx - p1.sw, p1.sy, p2.sx - p2.sw, p2.sy, p2.sx - p2.sw - r2, p2.sy, pal.rumble);
  poly(p1.sx + p1.sw + r1, p1.sy, p1.sx + p1.sw, p1.sy, p2.sx + p2.sw, p2.sy, p2.sx + p2.sw + r2, p2.sy, pal.rumble);
  poly(p1.sx - p1.sw, p1.sy, p1.sx + p1.sw, p1.sy, p2.sx + p2.sw, p2.sy, p2.sx - p2.sw, p2.sy, pal.road);
  if (pal.lane) {
    const l1 = p1.sw / Math.max(32, 8 * LANES), l2 = p2.sw / Math.max(32, 8 * LANES);
    const w1 = p1.sw * 2 / LANES, w2 = p2.sw * 2 / LANES;
    let x1 = p1.sx - p1.sw + w1, x2 = p2.sx - p2.sw + w2;
    for (let l = 1; l < LANES; l++, x1 += w1, x2 += w2)
      poly(x1 - l1 / 2, p1.sy, x1 + l1 / 2, p1.sy, x2 + l2 / 2, p2.sy, x2 - l2 / 2, p2.sy, pal.lane);
  }
  const fa = 1 - s.fogv;
  if (fa > .01) {
    ctx.globalAlpha = fa; ctx.fillStyle = FOG;
    ctx.fillRect(0, p2.sy, W, p1.sy - p2.sy + 1); ctx.globalAlpha = 1;
  }
}
function withClip(y, clipY, fn) {
  if (y > clipY) { ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, Math.max(0, clipY)); ctx.clip(); fn(); ctx.restore(); }
  else fn();
}
function drawTree(x, y, u, v) {
  const h = u * (1 + v * .5), w = h * .42;
  ctx.fillStyle = '#2a1a12'; ctx.fillRect(x - w * .06, y - h * .18, w * .12, h * .18);
  ctx.fillStyle = v > .5 ? '#0d3a26' : '#0a2f20';
  for (let k = 0; k < 3; k++) {
    const ty = y - h * .12 - k * h * .27, tw = w * (1 - k * .25) / 2 + w * .1;
    ctx.beginPath(); ctx.moveTo(x - tw, ty); ctx.lineTo(x + tw, ty); ctx.lineTo(x, ty - h * .42); ctx.fill();
  }
}
function drawLamp(x, y, u, side) {
  const h = u * 1.05, dir = side < 0 ? 1 : -1;
  ctx.fillStyle = '#20222b'; ctx.fillRect(x - u * .018, y - h, u * .036, h);
  ctx.fillRect(Math.min(x, x + dir * u * .25), y - h, Math.abs(u * .25), u * .03);
  const hx = x + dir * u * .25, hy = y - h;
  ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createRadialGradient(hx, hy, 0, hx, hy, u * .9);
  g.addColorStop(0, 'rgba(255,205,120,.55)'); g.addColorStop(1, 'rgba(255,150,60,0)');
  ctx.fillStyle = g; ctx.fillRect(hx - u, hy - u, u * 2, u * 2);
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#fff4cc'; ctx.beginPath(); ctx.arc(hx, hy, Math.max(1.5, u * .04), 0, 7); ctx.fill();
}
function carSprite(x, y, w, col, braking, stripe) {
  const h = w * .55;
  ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.beginPath(); ctx.ellipse(x, y, w * .56, h * .1, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#0b0b0e';
  ctx.fillRect(x - w * .5, y - h * .3, w * .14, h * .3); ctx.fillRect(x + w * .36, y - h * .3, w * .14, h * .3);
  // cabin
  ctx.fillStyle = col; ctx.beginPath();
  ctx.moveTo(x - w * .38, y - h * .52); ctx.lineTo(x - w * .27, y - h * .98);
  ctx.lineTo(x + w * .27, y - h * .98); ctx.lineTo(x + w * .38, y - h * .52); ctx.closePath(); ctx.fill();
  const gl = ctx.createLinearGradient(0, y - h, 0, y - h * .55);
  gl.addColorStop(0, '#1b2440'); gl.addColorStop(1, '#070a14');
  ctx.fillStyle = gl; ctx.beginPath();
  ctx.moveTo(x - w * .33, y - h * .56); ctx.lineTo(x - w * .235, y - h * .92);
  ctx.lineTo(x + w * .235, y - h * .92); ctx.lineTo(x + w * .33, y - h * .56); ctx.closePath(); ctx.fill();
  // body
  ctx.fillStyle = col; rr(x - w * .5, y - h * .6, w, h * .46, w * .05); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.18)'; rr(x - w * .5, y - h * .6, w, h * .08, w * .04); ctx.fill();
  if (stripe) { ctx.fillStyle = '#f5f5f5'; ctx.fillRect(x - w * .06, y - h * .98, w * .12, h * .84); }
  ctx.fillStyle = '#101116'; ctx.fillRect(x - w * .5, y - h * .2, w, h * .08);       // bumper
  ctx.fillStyle = '#e9e9e9'; ctx.fillRect(x - w * .1, y - h * .36, w * .2, h * .1);  // plate
  // tail lights
  ctx.fillStyle = braking ? '#ff3b3b' : '#b01818';
  rr(x - w * .47, y - h * .5, w * .24, h * .1, w * .02); ctx.fill();
  rr(x + w * .23, y - h * .5, w * .24, h * .1, w * .02); ctx.fill();
  ctx.globalCompositeOperation = 'lighter';
  const a = braking ? .7 : .35;
  [x - w * .35, x + w * .35].forEach(lx => {
    const g = ctx.createRadialGradient(lx, y - h * .45, 0, lx, y - h * .45, w * .4);
    g.addColorStop(0, `rgba(255,40,40,${a})`); g.addColorStop(1, 'rgba(255,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(lx - w * .4, y - h * .45 - w * .4, w * .8, w * .8);
  });
  ctx.globalCompositeOperation = 'source-over';
}
function render() {
  const base = findSeg(position), basePct = (position % SEG) / SEG;
  const playerY = lerp(base.p1.wy, base.p2.wy, basePct);
  let dx = -(base.curve * basePct), x = 0, maxy = H;
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - .5) * shake * 14, (Math.random() - .5) * shake * 14);
  drawBg();
  for (let n = 0; n < DRAW; n++) {
    const s = segs[(base.i + n) % segs.length], looped = s.i < base.i;
    const camX = playerX * ROAD - x, camY = CAMH + playerY, camZ = position - (looped ? trackLen : 0);
    proj(s.p1, camX, camY, camZ); proj(s.p2, camX - dx, camY, camZ);
    x += dx; dx += s.curve;
    s.clip = maxy; s.fogv = fogAt(n);
    if (s.p1.cz <= CAMD || s.p2.sy >= s.p1.sy || s.p2.sy >= maxy) continue;
    drawSeg(s); maxy = s.p1.sy;
  }
  // scenery + traffic, far to near
  for (let n = DRAW - 1; n > 0; n--) {
    const s = segs[(base.i + n) % segs.length];
    if (s.p1.cz <= CAMD || s.p1.sw < 3) continue;
    ctx.globalAlpha = Math.min(1, s.fogv * 1.7);
    for (const pr of s.props) {
      const u = s.p1.sw, px = s.p1.sx + pr.o * u, py = s.p1.sy;
      withClip(py, s.clip, () => pr.t === 'tree' ? drawTree(px, py, u, pr.v) : drawLamp(px, py, u, pr.o));
    }
    for (const c of s.cars) {
      const pct = (c.z % SEG) / SEG;
      const u = lerp(s.p1.sw, s.p2.sw, pct);
      const cx = lerp(s.p1.sx, s.p2.sx, pct) + c.o * u, cy = lerp(s.p1.sy, s.p2.sy, pct);
      withClip(cy, s.clip, () => carSprite(cx, cy, u * CARW, c.col, c.lane === 2, false));
    }
    ctx.globalAlpha = 1;
  }
  // headlight beams
  ctx.globalCompositeOperation = 'lighter';
  const bg = ctx.createLinearGradient(0, H, 0, H / 2 + 40);
  bg.addColorStop(0, 'rgba(255,240,200,.30)'); bg.addColorStop(1, 'rgba(255,240,200,0)');
  ctx.fillStyle = bg;
  [-1, 1].forEach(d => {
    ctx.beginPath(); ctx.moveTo(W / 2 + d * 60, H); ctx.lineTo(W / 2 + d * 230, H);
    ctx.lineTo(W / 2 + d * 70, H / 2 + 60); ctx.lineTo(W / 2 + d * 20, H / 2 + 60); ctx.closePath(); ctx.fill();
  });
  ctx.globalCompositeOperation = 'source-over';
  // player car
  if (state !== 'title' && !(invuln > 0 && Math.floor(clock * 14) % 2)) {
    const sp = speed / MAXS;
    const bounce = Math.sin(clock * 40) * 2.2 * sp + (Math.random() - .5) * sp * 1.5;
    const steer = (keys.ArrowRight || keys.KeyD || touch.r ? 1 : 0) - (keys.ArrowLeft || keys.KeyA || touch.l ? 1 : 0);
    ctx.save(); ctx.translate(W / 2, H - 22 + bounce); ctx.rotate(steer * .035 * sp);
    carSprite(0, 0, W * .24, '#d4162c', keys.ArrowDown || keys.KeyS, true);
    ctx.restore();
  }
  // particles
  ctx.globalCompositeOperation = 'lighter';
  particles.forEach(p => { ctx.globalAlpha = clamp(p.life * 2, 0, 1); ctx.fillStyle = p.col; ctx.fillRect(p.x, p.y, 4, 4); });
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  // rain
  if (rain) {
    ctx.strokeStyle = 'rgba(190,210,255,.35)'; ctx.lineWidth = 1.2; ctx.beginPath();
    drops.forEach(d => {
      d.y += 700 / 60 + 6; d.x -= 2 + speed / MAXS * 3;
      if (d.y > H) { d.y = -20; d.x = Math.random() * W + 100; }
      if (d.x < -10) d.x = W + 10;
      ctx.moveTo(d.x, d.y); ctx.lineTo(d.x + 3, d.y - d.l);
    });
    ctx.stroke();
    ctx.fillStyle = 'rgba(10,20,40,.18)'; ctx.fillRect(0, 0, W, H);
  }
  ctx.restore();
  // vignette
  const v = ctx.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * .95);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.6)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
}

/* ---------- drawing: HUD & screens ---------- */
function gauge() {
  const cx = W - 105, cy = H - 95, r = 70, sp = speed / MAXS;
  ctx.fillStyle = 'rgba(8,10,20,.72)'; ctx.beginPath(); ctx.arc(cx, cy, r + 10, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.15)'; ctx.lineWidth = 8; ctx.beginPath();
  ctx.arc(cx, cy, r, Math.PI * .75, Math.PI * 2.25); ctx.stroke();
  ctx.strokeStyle = sp > .85 ? '#ff4d4d' : '#4dd0ff'; ctx.beginPath();
  ctx.arc(cx, cy, r, Math.PI * .75, Math.PI * (.75 + 1.5 * sp)); ctx.stroke();
  const a = Math.PI * (.75 + 1.5 * sp);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.beginPath();
  ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(a) * (r - 8), cy + Math.sin(a) * (r - 8)); ctx.stroke();
  text(Math.round(sp * 280), cx, cy + 28, 30, '#fff');
  text('KM/H', cx, cy + 46, 12, '#9ab', 'center', 600);
  text('GEAR ' + (Math.min(6, Math.floor(sp * 6) + 1)), cx, cy - 22, 14, '#ffd166', 'center', 700);
}
function hud() {
  text('SCORE', 24, 32, 14, '#9ab', 'left', 600); text(Math.floor(score), 24, 66, 34, '#fff', 'left');
  text('BEST ' + best, 24, 90, 14, '#9ab', 'left', 600);
  const low = timeLeft < 10;
  text('TIME', W / 2, 30, 14, '#9ab', 'center', 600);
  text(Math.ceil(timeLeft), W / 2, 72, 48, low && Math.floor(clock * 4) % 2 ? '#ff5a5a' : '#ffe066');
  text('CHECKPOINT ' + (lap + 1), W - 24, 32, 14, '#9ab', 'right', 600);
  text('PASSED ' + overtakes, W - 24, 60, 22, '#fff', 'right');
  gauge();
  popups.forEach((p, i) => {
    ctx.globalAlpha = clamp(p.life * 1.5, 0, 1);
    text(p.t, W / 2, H * .32 + i * 40 - (1.4 - p.life) * 20, 40, p.col);
    ctx.globalAlpha = 1;
  });
}
function overlay(title, lines, sub) {
  ctx.fillStyle = 'rgba(4,5,15,.62)'; ctx.fillRect(0, 0, W, H);
  const g = ctx.createLinearGradient(0, 120, 0, 200);
  g.addColorStop(0, '#ffd166'); g.addColorStop(1, '#ff4d6d');
  text(title, W / 2, 190, 86, g);
  lines.forEach((l, i) => text(l, W / 2, 255 + i * 32, 22, '#e6ecff', 'center', 600));
  text(sub, W / 2, H - 70, 26, Math.floor(clock * 2) % 2 ? '#fff' : '#ffd166');
}
function draw() {
  render();
  if (state === 'title') {
    overlay('MIDNIGHT RUN', ['Beat the clock. Pass traffic. Reach every checkpoint.',
      '↑ / W  accelerate     ↓ / S  brake     ← → / A D  steer',
      'R  rain on/off     M  mute     (touch: hold left / right side of screen)'], 'PRESS ENTER OR TAP TO START');
  } else if (state === 'count') {
    hud(); text(Math.max(1, Math.ceil(cd)), W / 2, H / 2, 140, '#fff');
  } else if (state === 'play') {
    hud();
  } else {
    hud();
    overlay('TIME UP', ['Score  ' + Math.floor(score) + '      Best  ' + best,
      'Cars passed  ' + overtakes + '      Crashes  ' + crashes + '      Checkpoints  ' + lap],
      'PRESS ENTER OR TAP TO RACE AGAIN');
  }
}

/* ---------- main loop ---------- */
let lastT = 0;
function frame(t) {
  const dt = Math.min(.05, (t - lastT) / 1000 || .016); lastT = t;
  tick(dt); draw(); requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
